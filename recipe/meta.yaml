{% set name = "napari-pssr" %}
{% set version = "0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/napari-pssr-{{ version }}.tar.gz
  sha256: 5c9681e7f7a35f0d00357fdb33ae08754687b467bbebd43f3787d14e77d67f5c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools-scm
  run:
    - bioimageio.core
    - gunpowder
    - magicgui
    - matplotlib-base
    - napari
    - numpy
    - python >={{ python_min }}
    - pytorch
    - zarr

test:
  imports:
    - napari_pssr
  commands:
    - pip list
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pattonw/napari-pssr
  summary: A plugin for training and applying pssr
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaimergp
    - pattonw
